<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMKA Danmark – Find den rigtige motorolie</title>
<meta name="description" content="EMKA Danmark: find den rigtige motorolie til din bil via nummerplade. Ny hjemmeside på vej.">
<style>
  :root { --bg:#0A0A0B; --text:#F4F2EE; --muted:#9A978F; --gold:#C9A24A; --line:#24242A; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; min-height:100vh; display:flex; flex-direction:column; }
  main { flex:1; display:flex; flex-direction:column; justify-content:center; padding:48px 16px; max-width:760px; margin:0 auto; width:100%; }
  .eyebrow { color:var(--gold); font-family:ui-monospace,Menlo,monospace; letter-spacing:.12em; text-transform:uppercase; font-size:13px; margin-bottom:20px; }
  h1 { font-size:clamp(2.4rem,7vw,4.5rem); line-height:1; letter-spacing:-.03em; font-weight:650; margin-bottom:20px; }
  p { color:var(--muted); font-size:18px; line-height:1.6; max-width:56ch; }
  footer { border-top:1px solid var(--line); padding:20px 16px; text-align:center; color:var(--muted); font-size:14px; }
  footer a { color:var(--gold); }
</style>
</head>
<body>
<main>
  <div class="eyebrow">EMKA Danmark</div>
  <h1>Den rigtige olie.<br>Til netop din motor.</h1>
  <p>Vores nye hjemmeside er på vej. Snart kan du skrive din nummerplade og få den motorolie fra EMKA, som din bil skal bruge.</p>
</main>
<footer>
  © EMKA Danmark · <a href="https://autotelli.dk">Bilværdi fra autotelli.dk</a>
</footer>
</body>
</html>
